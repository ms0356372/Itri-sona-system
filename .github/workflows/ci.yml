name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Do not enable setup-node's npm cache until package-lock.json is committed.
      # setup-node intentionally fails before installation when cache metadata has no lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Temporary bootstrap for this PR: resolve a real lockfile from npm on the runner,
      # then verify the clean, lockfile-driven installation path used once it is committed.
      - name: Resolve dependency lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Preserve generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
